name: Build CallCaption

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + iOS 16.5 SDK
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -L -sS -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $HOME/theos/sdks
          cp -R /tmp/sdks/sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/
          ls $HOME/theos/sdks

      - name: Download sherpa-onnx iOS shared + ONNX Runtime static xcframework
        run: |
          mkdir -p vendor
          curl -L --fail -o /tmp/sherpa-ios.zip \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v2.0.1-ios-shared-onnxruntime-static.xcframework.zip
          unzip -q /tmp/sherpa-ios.zip -d vendor
          ls -la vendor/SherpaOnnxC.xcframework/ios-arm64/SherpaOnnxC.framework

      - name: Build arm64 CPU ASR helper
        run: |
          export THEOS=$HOME/theos
          make -C asr-helper
          mkdir -p layout/usr/local/bin
          BIN=$(find asr-helper/.theos -type f -name CallCaptionProASR | head -1)
          echo "helper=$BIN"
          test -n "$BIN"
          cp "$BIN" layout/usr/local/bin/CallCaptionProASR
          file layout/usr/local/bin/CallCaptionProASR
          lipo -info layout/usr/local/bin/CallCaptionProASR || true
          mkdir -p layout/Library/Frameworks
          rm -rf layout/Library/Frameworks/SherpaOnnxC.framework
          cp -R vendor/SherpaOnnxC.xcframework/ios-arm64/SherpaOnnxC.framework \
                layout/Library/Frameworks/
          chmod 0755 layout/Library/Frameworks/SherpaOnnxC.framework/SherpaOnnxC
          ls -lh layout/Library/Frameworks/SherpaOnnxC.framework/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          # dpkg 要求维护者脚本可执行；Windows/Windows-worktree 提交时 exec 位可能丢失
          chmod 0755 layout/DEBIAN/preinst layout/DEBIAN/postinst layout/DEBIAN/postrm 2>/dev/null || true
          chmod 0644 layout/DEBIAN/control 2>/dev/null || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Repack - relocate Pro bundle binary
        run: |
          rm -rf /tmp/rp && mkdir -p /tmp/rp
          dpkg-deb -R packages/*.deb /tmp/rp/pkg
          # 再兜底一次：维护者脚本必须 root:root + 0755，否则安装器会报权限错误
          chmod 0755 /tmp/rp/pkg/DEBIAN/preinst /tmp/rp/pkg/DEBIAN/postinst /tmp/rp/pkg/DEBIAN/postrm 2>/dev/null || true
          chmod 0644 /tmp/rp/pkg/DEBIAN/control 2>/dev/null || true
          if [ -d /tmp/rp/pkg/var/jb/CallCaptionProPrefs.bundle ]; then
            mkdir -p /tmp/rp/pkg/var/jb/Library/PreferenceBundles/CallCaptionProPrefs.bundle
            mv /tmp/rp/pkg/var/jb/CallCaptionProPrefs.bundle/* /tmp/rp/pkg/var/jb/Library/PreferenceBundles/CallCaptionProPrefs.bundle/
            rm -rf /tmp/rp/pkg/var/jb/CallCaptionProPrefs.bundle
          fi
          chmod 755 /tmp/rp/pkg/var/jb/Library/PreferenceBundles/CallCaptionProPrefs.bundle/CallCaptionProPrefs 2>/dev/null || true
          # /var/mobile 不在 Theos rootless 布局前缀内，必须 repack 时直接放入真实路径
          mkdir -p /tmp/rp/pkg/var/mobile/Library/CallCaptionPro
          cp resources/selftest16k.wav /tmp/rp/pkg/var/mobile/Library/CallCaptionPro/selftest16k.wav
          chmod 0644 /tmp/rp/pkg/var/mobile/Library/CallCaptionPro/selftest16k.wav
          # 热词 BPE 词表（由模型 bpe.model 导出，空格分隔），放主包避免重装模型包
          mkdir -p /tmp/rp/pkg/var/mobile/Library/CallCaptionPro/models/x-asr-480ms
          cp resources/bpe.vocab /tmp/rp/pkg/var/mobile/Library/CallCaptionPro/models/x-asr-480ms/bpe.vocab
          chmod 0644 /tmp/rp/pkg/var/mobile/Library/CallCaptionPro/models/x-asr-480ms/bpe.vocab
          # launchd 要求 LaunchDaemon plist 等文件属于 root:wheel；
          # CI 默认用 runner 用户打包，必须强制 root 属主。
          dpkg-deb --root-owner-group -Zxz -b /tmp/rp/pkg /tmp/rp/fixed.deb
          mkdir -p out
          cp /tmp/rp/fixed.deb out/

      - name: Build model resource package (installed once)
        run: |
          mkdir -p model-package/DEBIAN \
                   model-package/var/mobile/Library/CallCaptionPro/models/x-asr-480ms \
                   model-package/var/mobile/Library/CallCaptionPro/models/zh-14m
          printf '%s\n' \
            'Package: net.user.callcaptionpro.models' \
            'Name: CallCaption Pro Models' \
            'Version: 1.0.1' \
            'Architecture: iphoneos-arm64' \
            'Description: X-ASR 480ms remote model + zh-14M local Chinese model for CallCaption Pro.' \
            'Maintainer: user <user@localhost>' \
            'Author: user' \
            'Section: Tweaks' \
            > model-package/DEBIAN/control
          printf '%s\n' \
            '#!/bin/sh' \
            'mkdir -p /var/mobile/Library/CallCaptionPro' \
            'chown -R mobile:mobile /var/mobile/Library/CallCaptionPro 2>/dev/null || true' \
            'chmod 0755 /var/mobile/Library/CallCaptionPro 2>/dev/null || true' \
            'exit 0' \
            > model-package/DEBIAN/postinst
          chmod 0755 model-package/DEBIAN/postinst
          curl -L --fail -o /tmp/asr-model.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-x-asr-480ms-streaming-zipformer-transducer-zh-en-punct-int8-2026-06-05.tar.bz2
          rm -rf /tmp/asr-model && mkdir -p /tmp/asr-model
          tar -xjf /tmp/asr-model.tar.bz2 -C /tmp/asr-model
          SRC=$(find /tmp/asr-model -maxdepth 1 -type d -name "sherpa-onnx-x-asr-480ms-*" | head -1)
          echo "model src=$SRC"
          test -n "$SRC"
          cp "$SRC/encoder.int8.onnx" "$SRC/decoder.onnx" "$SRC/joiner.int8.onnx" \
             "$SRC/tokens.txt" "$SRC/bpe.model" \
             model-package/var/mobile/Library/CallCaptionPro/models/x-asr-480ms/
          # Pro2.1.23：本机中文专用 zh-14M（25MB int8），远端仍用 x-asr。
          curl -L --fail -o /tmp/zh14m.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2
          rm -rf /tmp/zh14m && mkdir -p /tmp/zh14m
          tar -xjf /tmp/zh14m.tar.bz2 -C /tmp/zh14m
          ZH=$(find /tmp/zh14m -maxdepth 1 -type d -name "sherpa-onnx-streaming-zipformer-zh-14M-*" | head -1)
          echo "zh model src=$ZH"
          test -n "$ZH"
          cp "$ZH/encoder-epoch-99-avg-1.int8.onnx" \
             model-package/var/mobile/Library/CallCaptionPro/models/zh-14m/encoder.int8.onnx
          cp "$ZH/decoder-epoch-99-avg-1.int8.onnx" \
             model-package/var/mobile/Library/CallCaptionPro/models/zh-14m/decoder.onnx
          cp "$ZH/joiner-epoch-99-avg-1.int8.onnx" \
             model-package/var/mobile/Library/CallCaptionPro/models/zh-14m/joiner.int8.onnx
          cp "$ZH/tokens.txt" \
             model-package/var/mobile/Library/CallCaptionPro/models/zh-14m/tokens.txt
          dpkg-deb --root-owner-group -Zxz -b model-package out/net.user.callcaptionpro.models_1.0.1_iphoneos-arm64.deb
          ls -lh out/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CallCaption-deb
          path: out/*.deb
